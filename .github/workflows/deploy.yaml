name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      pat:
        description: 'ChatBlogr Access Token'
        required: true
        type: string
      site_name:
        description: 'Site Name'
        required: false
        type: string
      image_url:
        description: 'Base Image URL for Social Media'
        required: false
        type: string
      environment:
        description: 'Deployment Environment (production or preview)'
        required: false
        type: string
        default: 'production'
      vercel_org_id:
        description: 'Vercel Organization ID'
        required: true
        type: string
      vercel_project_id:
        description: 'Vercel Project ID'
        required: true
        type: string
      vercel_token:
        description: 'Vercel Token'
        required: true
        type: string
      
        
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate images
        run: npm run resize
        env:
          IMAGE_URL: ${{ github.event.inputs.image_url }}

      - name: Update manifest
        run: npm run manifest
        env:
          SITE_NAME: ${{ github.event.inputs.site_name }}

      - name: Generate ads.txt
        run: node scripts/generate-ads.js
        env:
          CHATBLOGR_PAT: ${{ github.event.inputs.pat }}

      - name: Pull Vercel Project Settings
        run: npx vercel pull --yes --environment=${{ github.event.inputs.environment }}
        env:
          VERCEL_TOKEN: ${{ github.event.inputs.vercel_token }}
          VERCEL_ORG_ID: ${{ github.event.inputs.vercel_org_id }}
          VERCEL_PROJECT_ID: ${{ github.event.inputs.vercel_project_id }}

      - name: Build with Vercel (includes generated files)
        run: |
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            npx vercel build --prod
          else
            npx vercel build
          fi
        env:
          CHATBLOGR_PAT: ${{ github.event.inputs.pat }}
          VERCEL_TOKEN: ${{ github.event.inputs.vercel_token }}
          VERCEL_ORG_ID: ${{ github.event.inputs.vercel_org_id }}
          VERCEL_PROJECT_ID: ${{ github.event.inputs.vercel_project_id }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            npx vercel deploy --prod --prebuilt --token=${{ github.event.inputs.vercel_token }} --archive=tgz --env="CHATBLOGR_PAT=${{ github.event.inputs.pat }}"
          else
            npx vercel deploy --prebuilt --token=${{ github.event.inputs.vercel_token }} --archive=tgz --env="CHATBLOGR_PAT=${{ github.event.inputs.pat }}"
          fi
        env:
          VERCEL_ORG_ID: ${{ github.event.inputs.vercel_org_id }}
          VERCEL_PROJECT_ID: ${{ github.event.inputs.vercel_project_id }}
